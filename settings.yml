# The org's repository policy, in one reviewable place.
#
# Applied by .github/workflows/repo-settings-reconcile.yml -- on a push to
# this file, nightly, and on demand. `repository` and `security` are written
# into every non-archived repository; `org_rulesets` are written once, to the
# organisation.
#
# The shape here is deliberately the one github-community-projects/safe-settings
# consumes. If this org ever outgrows sixty lines of bash, this file migrates
# unchanged and only the runner is thrown away.

repository:
  # auto-merge-gate.yml runs `gh pr merge --auto --squash`. All three of these
  # are load-bearing for that one command: without allow_auto_merge the API
  # refuses with "Resource not accessible by integration", and without
  # allow_squash_merge the --squash flag has nothing to select.
  #
  # BLOCKED BY THE PLAN, measured 2026-09-02. GitHub accepts a PATCH setting
  # allow_auto_merge, returns success, and silently discards it on a private
  # repository below Pro: "Auto-merge for pull requests is available in public
  # repositories with GitHub Free and GitHub Free for organizations, and in
  # public and private repositories with GitHub Pro, GitHub Team, GitHub
  # Enterprise Cloud, and GitHub Enterprise Server." All twenty repositories
  # here are private on Free, so this key cannot be applied by any token and
  # the reconciler reports it as NOT-APPLIED rather than pretending.
  #
  # It stays declared on purpose. This file is the statement of intent, and
  # the day the org moves plan the next run applies it with no edit needed.
  # The org moved to Team on 2026-09-25, and review-gate below is what keeps
  # auto-merge from merging a pull request the moment CI is green.
  allow_auto_merge: true
  allow_squash_merge: true

  # Merged branches are junk, and GitHub will not clear them up on its own.
  # Forward-looking only -- see maintenance.prune_merged_branches below for
  # what was left behind before this landed. Verified applied on all twenty
  # repositories 2026-09-02.
  delete_branch_on_merge: true

security:
  # DETECTION. Renovate is this org's dependency updater, and its
  # vulnerabilityAlerts block in default.json is enabled with
  # prCreation: immediate -- but Renovate reads GitHub's vulnerability alerts
  # to know what to fix. With this off on a repo, that entire security
  # fast-path is inert and nothing says so.
  #
  # It WAS off. On 2026-09-02 the first successful reconcile found alerts
  # disabled on all twenty repositories and enabled them. Renovate's security
  # path had never had anything to read.
  dependabot_alerts: enabled

  # REMEDIATION, and deliberately off. Renovate already opens these PRs
  # immediately. Both enabled means two bots racing to fix the same CVE, and
  # whichever loses leaves a stale branch behind. Renovate owns remediation;
  # Dependabot owns detection. Written down so nobody enables it later meaning
  # well.
  dependabot_security_updates: disabled

  # Reported, never written. Availability varies by plan and repository
  # visibility, and a reconciler that fails on something it cannot control
  # teaches people to ignore it. Currently `unavailable` on all twenty.
  secret_scanning: report_only

maintenance:
  # Sweeps branches whose PR was merged before delete_branch_on_merge landed.
  # Narrow on purpose: merged PR only, never the default branch, never a
  # protected branch, and never one with another open PR pointing at it. The
  # commits already live in the base branch, so this removes a pointer, not
  # work.
  #
  # Off by default. Turn it on deliberately, and watch one dry run first.
  prune_merged_branches: false

org_rulesets:
  # ORGANISATION rulesets, written once to the org rather than into each
  # repository. They name no repository: `~ALL` covers every repository the
  # org has now and every one it creates later, with no edit here. This file
  # knows the policy, never the repositories it applies to.
  #
  # NEEDS GITHUB TEAM, which the org has been on since 2026-09-25. On a plan
  # without organisation rulesets the reconciler reports PLAN-BLOCKED rather
  # than failing, like allow_auto_merge above.
  #
  # NEEDS AN ORG PERMISSION. Writing these takes the organisation permission
  # "Administration: read and write" on ORG_ADMIN_TOKEN, which is more than
  # the repository Administration the rest of this file needs. Without it
  # the reconciler reports NEEDS-ORG-ADMIN, leaves these alone, and carries
  # on with the repository settings above.
  #
  # Keys, per ruleset:
  # - enforcement: active | disabled.
  # - repositories / branches: the `include` lists. `exclude` is always
  #   empty, and the reconciler repairs any exclusion added by hand, because
  #   an excluded default branch is a gate switched off.
  # - bypass_apps: GitHub App slugs, resolved to IDs at run time, allowed to
  #   merge their own pull requests past the ruleset (`pull_request` mode:
  #   never a direct push).
  # - pull_request: the pull_request rule's parameters, as the rulesets API
  #   takes them.
  # - required_checks: `strict` (the branch must be up to date) and `checks`,
  #   each a check name plus the app slug that must post it.
  # - block_force_push / block_deletion.
  # - retire_repo_rulesets: once this org ruleset is read back active and
  #   matching, delete REPOSITORY rulesets with exactly this name from every
  #   repository. Never any other name.

  review-gate:
    # THE MERGE GATE. Nothing reaches a default branch without a reviewed
    # pull request: CodeRabbit has approved the latest commit, every review
    # conversation is resolved, and CodeRabbit's check is green. Nobody
    # bypasses it -- not an admin, and not an agent working with an admin's
    # token. That second case is the one that happened: on 2026-09-25 two
    # evidence-reply PRs were merged by an agent while CodeRabbit's status
    # still read "Review in progress", and the review was abandoned.
    enforcement: active
    repositories: ["~ALL"]
    branches: ["~DEFAULT_BRANCH"]

    # The same gate was put on all 33 repositories by hand on 2026-09-25, as
    # repository rulesets named `review-gate`, the evening the org moved to
    # Team. Those copies are deleted only once this org ruleset is verified;
    # until then both apply, and they ask for the same thing. Remove this key
    # once a run reports none left.
    retire_repo_rulesets: true

    # Renovate, and only Renovate. CodeRabbit refuses to review pull requests
    # from bots ("Review skipped: bot user not eligible for review"), so it
    # can never approve one, and without this every dependency update would
    # sit blocked forever. Renovate automerges only once the branch's own
    # checks are green.
    #
    # The bypass applies to the actor that performs the merge, so Renovate must
    # merge directly as itself. GitHub's native auto-merge completes the merge
    # on its own schedule, and the bypass doesn't carry over to it. That is why
    # default.json sets platformAutomerge: false and auto-merge-gate.yml skips
    # bot pull requests.
    #
    # Deliberately NOT here:
    # - Dependabot never merges its own pull requests, so bypass would do
    #   nothing for it.
    # - github-actions performs the merge when a workflow enables auto-merge.
    #   Giving it bypass would let any workflow in any repository merge past
    #   this gate, which is the hole this ruleset exists to close. Dependabot
    #   pull requests therefore need a human approval, or the repository moves
    #   to Renovate, which is this estate's updater anyway.
    bypass_apps: [renovate]

    pull_request:
      # The one approval comes from CodeRabbit, which approves only once its
      # comments are resolved, it has reviewed the latest commit, and no
      # pre-merge check is failing. That needs "Request Changes Workflow"
      # switched on in CodeRabbit's organisation settings. On a one-person
      # org the author can't approve their own pull request, so CodeRabbit is
      # the only reviewer who can.
      #
      # A RULESET CAN'T NAME CODERABBIT AS THE REVIEWER. `required_reviewers`
      # accepts teams only, not users or apps. So for a pull request that someone
      # other than the owner opened (a Dependabot or agent-app PR), the owner's own
      # approval also satisfies this. That's deliberate here: it's still a review,
      # and it's how Dependabot PRs get through. For everything the owner's
      # account opens, which is every agent working with the owner's token,
      # CodeRabbit's approval is the only one that can count.
      #
      # DON'T DROP THIS TO 0. If an app's approval ever stops counting, the
      # CodeRabbit check below can't stand in for it: its status goes green
      # when a review is skipped, paused or rate-limited, so the gate would
      # no longer prove a review happened.
      required_approving_review_count: 1
      # A push after approval drops it, so the approval always covers the
      # code that merges.
      dismiss_stale_reviews_on_push: true
      required_review_thread_resolution: true
      require_code_owner_review: false
      require_last_push_approval: false
      allowed_merge_methods: [squash]

    required_checks:
      # The branch must be up to date with its base before merging, so the
      # green checks describe the code that actually lands.
      strict: true
      checks:
        # Pinned to the app that must post it: a workflow cannot satisfy it by
        # posting its own status named "CodeRabbit". This status alone is NOT
        # proof of review, because CodeRabbit marks it success even when it
        # skipped, paused or was rate-limited. The approval above is the
        # proof. This check makes the merge wait while a review is running.
        - context: CodeRabbit
          app: coderabbitai

    # No force-pushes and no deleting the default branch.
    block_force_push: true
    block_deletion: true

  ci-gate:
    # GREEN CI, without this file knowing any repository's job names. Each
    # repository publishes ONE check, `ci-gate`, from a top-level job in its
    # own CI workflow that passes only when all of that repository's CI jobs
    # passed. The contract, and the job to copy, are in the README under
    # "The `ci-gate` contract".
    #
    # DISABLED FOR NOW, on purpose. Required but never reported, a check
    # blocks every pull request forever, and repositories are adopting
    # `ci-gate` in their own pull requests. This flips to `active` in a
    # reviewed pull request once every repository's CI publishes `ci-gate`.
    enforcement: disabled
    repositories: ["~ALL"]
    branches: ["~DEFAULT_BRANCH"]

    required_checks:
      strict: true
      checks:
        # Pinned to GitHub Actions, so only a workflow run can satisfy it.
        - context: ci-gate
          app: github-actions

# Version updates are deliberately absent, and no dependabot.yml is shipped:
# that would duplicate Renovate outright and put two changelogs on every bump.
