# The org's repository policy, in one reviewable place.
#
# Applied to every non-archived repository by
# .github/workflows/repo-settings-reconcile.yml -- on a push to this file,
# nightly, and on demand.
#
# The shape here is deliberately the one github-community-projects/safe-settings
# consumes. If this org ever outgrows sixty lines of bash, this file migrates
# unchanged and only the runner is thrown away.

repository:
  # auto-merge-gate.yml runs `gh pr merge --auto --squash`. All three of these
  # are load-bearing for that one command: without allow_auto_merge the API
  # refuses with "Resource not accessible by integration", and without
  # allow_squash_merge the --squash flag has nothing to select.
  #
  # BLOCKED BY THE PLAN, measured 2026-09-02. GitHub accepts a PATCH setting
  # allow_auto_merge, returns success, and silently discards it on a private
  # repository below Pro: "Auto-merge for pull requests is available in public
  # repositories with GitHub Free and GitHub Free for organizations, and in
  # public and private repositories with GitHub Pro, GitHub Team, GitHub
  # Enterprise Cloud, and GitHub Enterprise Server." All twenty repositories
  # here are private on Free, so this key cannot be applied by any token and
  # the reconciler reports it as NOT-APPLIED rather than pretending.
  #
  # It stays declared on purpose. This file is the statement of intent, and
  # the day the org moves plan the next run applies it with no edit needed.
  allow_auto_merge: true
  allow_squash_merge: true

  # Merged branches are junk, and GitHub will not clear them up on its own.
  # Forward-looking only -- see maintenance.prune_merged_branches below for
  # what was left behind before this landed. Verified applied on all twenty
  # repositories 2026-09-02.
  delete_branch_on_merge: true

security:
  # DETECTION. Renovate is this org's dependency updater, and its
  # vulnerabilityAlerts block in default.json is enabled with
  # prCreation: immediate -- but Renovate reads GitHub's vulnerability alerts
  # to know what to fix. With this off on a repo, that entire security
  # fast-path is inert and nothing says so.
  #
  # It WAS off. On 2026-09-02 the first successful reconcile found alerts
  # disabled on all twenty repositories and enabled them. Renovate's security
  # path had never had anything to read.
  dependabot_alerts: enabled

  # REMEDIATION, and deliberately off. Renovate already opens these PRs
  # immediately. Both enabled means two bots racing to fix the same CVE, and
  # whichever loses leaves a stale branch behind. Renovate owns remediation;
  # Dependabot owns detection. Written down so nobody enables it later meaning
  # well.
  dependabot_security_updates: disabled

  # Reported, never written. Availability varies by plan and repository
  # visibility, and a reconciler that fails on something it cannot control
  # teaches people to ignore it. Currently `unavailable` on all twenty.
  secret_scanning: report_only

maintenance:
  # Sweeps branches whose PR was merged before delete_branch_on_merge landed.
  # Narrow on purpose: merged PR only, never the default branch, never a
  # protected branch, and never one with another open PR pointing at it. The
  # commits already live in the base branch, so this removes a pointer, not
  # work.
  #
  # Off by default. Turn it on deliberately, and watch one dry run first.
  prune_merged_branches: false

rulesets:
  # THE MERGE GATE. Nothing reaches a default branch without a reviewed pull
  # request: CodeRabbit has reviewed and approved the latest commit, every
  # review conversation is resolved, and CI is green. Nobody bypasses it --
  # not an admin, and not an agent working with an admin's token. That second
  # case is the one that happened: on 2026-09-25 two evidence-reply PRs were
  # merged by an agent while CodeRabbit's status still read "Review in
  # progress", and the review was abandoned. Nothing stopped it, because
  # nothing here could.
  #
  # WHY PER-REPOSITORY RULESETS, not one org ruleset. Written by this file into
  # every repository, a ruleset works the same way on the org and on a personal
  # account, which has no account-level rulesets at all. GitHub's own docs also
  # disagree about which plan gets org-level rulesets. A per-repo ruleset needs
  # only Pro or Team.
  #
  # BLOCKED BY THE PLAN until the org moves to Team. On a Free private
  # repository GitHub refuses rulesets outright ("Upgrade to GitHub Pro or make
  # this repository public"). The reconciler reports that as PLAN-BLOCKED
  # rather than failing, like allow_auto_merge above, and applies everything
  # on the first run after the upgrade.
  review-gate:
    enforcement: active
    branches: ["~DEFAULT_BRANCH"]

    # PILOT FIRST. While this list exists, the ruleset is written only to the
    # repositories named here. The one open question is whether GitHub counts
    # CodeRabbit's approval (see pull_request below), and that can only be
    # answered on a real PR once the org is on Team. Delete this key, and the
    # next run applies the gate to every repository, only after a test PR here
    # has shown mergeStateStatus going from BLOCKED to CLEAN on CodeRabbit's
    # approval.
    only_repos: [evidence-reply]

    # GitHub App slugs, resolved to IDs at run time. Bypass here is
    # `pull_request` mode only: the app may merge its own pull request, never
    # push to the branch directly.
    #
    # Renovate, and only Renovate. CodeRabbit refuses to review pull requests
    # from bots ("Review skipped: bot user not eligible for review"), so it
    # can never approve one, and without this every dependency update would
    # sit blocked forever. Renovate automerges only once the branch's own
    # checks are green.
    #
    # The bypass applies to the actor that performs the merge, so Renovate must
    # merge directly as itself. GitHub's native auto-merge completes the merge
    # on its own schedule, and the bypass doesn't carry over to it. That is why
    # default.json sets platformAutomerge: false and auto-merge-gate.yml skips
    # bot pull requests.
    #
    # Deliberately NOT here:
    # - Dependabot never merges its own pull requests, so bypass would do
    #   nothing for it.
    # - github-actions performs the merge when a workflow enables auto-merge.
    #   Giving it bypass would let any workflow in any repository merge past
    #   this gate, which is the hole this ruleset exists to close. Dependabot
    #   pull requests therefore need a human approval, or the repository moves
    #   to Renovate, which is this estate's updater anyway.
    bypass_apps: [renovate]

    pull_request:
      # The one approval comes from CodeRabbit, which approves only once its
      # comments are resolved, it has reviewed the latest commit, and no
      # pre-merge check is failing. That needs "Request Changes Workflow"
      # switched on in CodeRabbit's organisation settings. On a one-person
      # org the author can't approve their own pull request, so CodeRabbit is
      # the only reviewer who can.
      #
      # PROVE IT BEFORE RELYING ON IT. GitHub doesn't document whether an app's
      # approval counts, and other repos report that CodeRabbit's does. That's
      # what `only_repos` above is for. If it turns out not to count, don't just
      # drop this to 0: the CodeRabbit status goes green on a skipped review, so
      # the gate would no longer prove a review happened.
      required_approving_review_count: 1
      # A push after approval drops it, so the approval always covers the
      # code that merges.
      dismiss_stale_reviews_on_push: true
      required_review_thread_resolution: true
      require_code_owner_review: false
      require_last_push_approval: false
      allowed_merge_methods: [squash]

    required_checks:
      # The branch must be up to date with its base before merging, so the
      # green checks describe the code that actually lands.
      strict: true

      # Required everywhere, and pinned to the app that must post it: a
      # workflow cannot satisfy it by posting its own status named
      # "CodeRabbit". This status alone is NOT proof of review, because
      # CodeRabbit marks it success even when it skipped or was rate limited.
      # The approval above is the proof. This check makes the merge wait
      # while a review is still running.
      everywhere:
        - context: CodeRabbit
          app: coderabbitai

      # Each repository's CI, by exact check-run name, all from GitHub Actions.
      # Names are copied from real pull-request runs, or from the shared
      # reusable workflows, where the name is "<caller job> / <job name>".
      #
      # Left out on purpose, because requiring them would block pull requests
      # forever or add nothing:
      # - advisory checks that pass whatever they find: `security / Ecosystem
      #   audit`, `ci / Lint` with lint-strict off, Lighthouse, shellcheck;
      # - checks that are always skipped on a pull request (`ci / Typecheck`
      #   when typecheck is off, and agent-pipeline's jobs);
      # - checks that only run when certain paths change (`actionlint /
      #   actionlint` in consuming repositories): if one is required, any
      #   other pull request waits forever for a check that never starts.
      #
      # A repository missing from this list gets the review gate but no CI
      # requirement, and the reconciler reports it as `no-ci-checks`.
      per_repo:
        .github: ["actionlint", "Renovate presets"]
        agent-egress-proxy: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        agent-egress-proxy-clean: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        agent-os: ["test"]
        ai-influencer-engine: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        coolify-mcp-oauth: ["image", "Privilege drop and volume adoption"]
        cymatics-engine: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        drillwright: ["checks"]
        evidence-reply: ["image"]
        grit: ["ci / Verify", "Guard the sandbox claim", "security / Secrets", "security / Vulnerable dependencies"]
        quarterdeck: ["Lint · Typecheck · Build · Test", "security / Secrets", "security / Vulnerable dependencies"]
        tankster-ai-public: ["Lint · Typecheck · Build", "security / Secrets", "security / Vulnerable dependencies"]
        tankster-books: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        tankster-core: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies", "no unresolved review threads"]
        tankster-infra: ["validate", "security / Secrets", "security / Vulnerable dependencies"]
        tankster-scribe: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]
        tankster-seed: ["ci / Verify", "security / Secrets", "security / Vulnerable dependencies"]

    # No force-pushes and no deleting the default branch.
    block_force_push: true
    block_deletion: true

# Version updates are deliberately absent, and no dependabot.yml is shipped:
# that would duplicate Renovate outright and put two changelogs on every bump.
