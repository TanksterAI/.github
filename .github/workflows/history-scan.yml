# TEMPORARY. Never merged: this pull request exists only to run a full-history
# secret scan before TanksterAI/.github is made public, and is closed (and its
# branch deleted) as soon as the scan has reported.
#
# Once a repository is public, every commit on every branch AND every pull
# request ref (refs/pull/N/head) can be fetched by anyone, and PR refs cannot
# be deleted. So the scan covers all of them, not just main.
#
# Runs on the light lane (Cloud Run, no Docker needed) when it is open.
name: history-scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: >-
      ${{ vars.CI_LIGHT_RUNNER == 'tankster-light'
          && format('tankster-light-{0}-{1}', github.run_id, github.run_attempt)
          || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch every branch, tag and pull request ref
        run: |
          set -euo pipefail
          git fetch --quiet --force origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*'
          echo "refs:    $(git for-each-ref | wc -l)"
          echo "commits: $(git rev-list --all | wc -l)"

      - name: Install gitleaks (no sudo, checksum pinned)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "$url" -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/bin" gitleaks
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Scan all refs (redacted)
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/bin/gitleaks" git . \
            --log-opts="--all" --redact --no-banner \
            --report-format json --report-path "${RUNNER_TEMP}/report.json" \
            --exit-code 0
          n="$(jq length "${RUNNER_TEMP}/report.json")"
          {
            echo "### gitleaks over every branch, tag and PR ref"
            echo
            echo "Commits scanned: $(git rev-list --all | wc -l). Findings: ${n}."
            if [ "${n}" != "0" ]; then
              echo
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) |"' "${RUNNER_TEMP}/report.json"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
