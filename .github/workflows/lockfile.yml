# Reusable lockfile regeneration bot.
#
# Unifies three near-identical implementations (rishitank-portfolio,
# rishitank-recipes, quarterdeck) and keeps the non-obvious correctness
# properties all three discovered independently:
#
#   * stage before diffing. `git diff --quiet` compares the index to the
#     worktree and is blind to untracked files, so a lockfile that does not yet
#     exist reads as "nothing to commit". Stage first, then diff --cached.
#   * refuse to proceed if the resolver rewrote package.json. Regenerating a
#     lockfile must not silently change declared dependency ranges.
#   * prove the result. A lockfile that resolves but cannot be installed
#     frozen is worse than no change at all.
#
# Two modes:
#
#   * resolve (default) -- `install --lockfile-only`. Adds or removes entries
#     so the lockfile matches package.json, but keeps every resolution that is
#     still in range. This is the right mode after editing package.json.
#   * maintenance -- discard the lockfile and resolve every range afresh, the
#     way Renovate's lockFileMaintenance does. This is the only way to move a
#     TRANSITIVE dependency to a newer version its range already allows
#     (`install --lockfile-only` deliberately keeps existing resolutions, so an
#     osv-scanner finding on a transitive package never clears in resolve
#     mode). package.json is still never rewritten -- `update` is not used
#     because pnpm's update rewrites the declared ranges as a side effect.
name: lockfile

on:
  workflow_call:
    inputs:
      package-manager:
        description: npm or pnpm.
        type: string
        default: npm
      pnpm-version:
        type: string
        default: ""
      node-version-file:
        type: string
        default: .nvmrc
      node-version:
        type: string
        default: ""
      mode:
        description: resolve (keep in-range resolutions) or maintenance (regenerate from scratch).
        type: string
        default: resolve
      runs-on:
        description: >-
          Runner label. Empty (the default) follows the organisation's
          CI_RUNNER variable, which moves CI onto the Cloud Build fallback
          runner when the included Actions minutes run out, and means
          ubuntu-latest when that variable is unset.
        type: string
        default: ""
      verify:
        description: Command proving the regenerated lockfile actually installs and builds.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  lockfile:
    name: Regenerate lockfile
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Resolve Node version source
        id: node
        run: |
          set -euo pipefail
          if [ -n "${VERSION_FILE}" ] && [ -f "${VERSION_FILE}" ]; then
            echo "file=${VERSION_FILE}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          elif [ -n "${VERSION}" ]; then
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=No Node version::Neither node-version-file nor node-version resolved to anything."
            exit 1
          fi
        env:
          VERSION_FILE: ${{ inputs.node-version-file }}
          VERSION: ${{ inputs.node-version }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ steps.node.outputs.file }}
          node-version: ${{ steps.node.outputs.version }}

      - name: Record package.json checksum
        id: before
        run: echo "sum=$(sha256sum package.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Determine lockfile
        id: lock
        run: |
          set -euo pipefail
          if [ "${PM}" = "pnpm" ]; then
            echo "path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "path=package-lock.json" >> "$GITHUB_OUTPUT"
          fi
        env:
          PM: ${{ inputs.package-manager }}

      - name: Validate mode
        run: |
          set -euo pipefail
          case "${MODE}" in
            resolve|maintenance) ;;
            *)
              echo "::error title=Unknown mode::mode must be 'resolve' or 'maintenance', got '${MODE}'."
              exit 1
              ;;
          esac
        env:
          MODE: ${{ inputs.mode }}

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          if [ "${MODE}" = "maintenance" ]; then
            echo "maintenance mode: discarding ${LOCKFILE} and resolving every range afresh."
            rm -f -- "${LOCKFILE}"
          fi
          if [ "${PM}" = "pnpm" ]; then
            pnpm install --lockfile-only
          else
            npm install --package-lock-only
          fi
        env:
          PM: ${{ inputs.package-manager }}
          MODE: ${{ inputs.mode }}
          LOCKFILE: ${{ steps.lock.outputs.path }}

      - name: Refuse if package.json was rewritten
        run: |
          set -euo pipefail
          after=$(sha256sum package.json | cut -d' ' -f1)
          if [ "$after" != "${BEFORE}" ]; then
            echo "::error title=package.json modified::The resolver rewrote package.json. Regenerating a lockfile must not change declared ranges. Review and commit that change deliberately."
            git --no-pager diff -- package.json
            exit 1
          fi
        env:
          BEFORE: ${{ steps.before.outputs.sum }}

      # Stage first. `git diff --quiet` cannot see an untracked file, so a
      # brand-new lockfile would otherwise report as "already up to date".
      - name: Stage and check for changes
        id: changed
        run: |
          set -euo pipefail
          git add -- "${LOCKFILE}"
          if git diff --cached --quiet -- "${LOCKFILE}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "${LOCKFILE} already up to date; nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${LOCKFILE}: $(wc -l < "${LOCKFILE}") lines"
          fi
        env:
          LOCKFILE: ${{ steps.lock.outputs.path }}

      - name: Prove the lockfile installs frozen
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if [ "${PM}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
        env:
          PM: ${{ inputs.package-manager }}

      - name: Prove the project still builds
        if: steps.changed.outputs.changed == 'true' && inputs.verify != ''
        run: ${{ inputs.verify }}

      - name: Commit
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${MODE}" = "maintenance" ]; then
            git commit -m "chore(deps): lockfile maintenance -- regenerate ${LOCKFILE} from scratch"
          else
            git commit -m "chore: regenerate ${LOCKFILE}"
          fi
          git push
        env:
          LOCKFILE: ${{ steps.lock.outputs.path }}
          MODE: ${{ inputs.mode }}
