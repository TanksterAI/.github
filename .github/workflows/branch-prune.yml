# Sweeps branches whose pull request was merged.
#
# `delete_branch_on_merge` only applies going forward. Every branch from a PR
# merged before that setting landed stays forever -- agent-os alone was
# carrying two.
#
# Separate from repo-settings-reconcile.yml on purpose. Settings drift is
# reversible by rewriting a setting; a deleted branch is not reversible by
# rerunning the job. Different blast radius deserves a different switch.
#
# Governed by `maintenance.prune_merged_branches` in ../../settings.yml, which
# ships off. Turn it on deliberately and watch one dry run first.
name: branch-prune

on:
  schedule:
    # Weekly, not nightly. There is no hurry, and a slower cadence means a
    # mistake has more chance of being noticed between runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it.
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    name: Prune merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Prune
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry-run }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_ADMIN_TOKEN is not set."
            exit 1
          fi

          POLICY=settings.yml
          enabled=$(yq -r '.maintenance.prune_merged_branches // false' "${POLICY}")
          if [ "${enabled}" != "true" ]; then
            echo "maintenance.prune_merged_branches is false in ${POLICY}; nothing to do."
            echo "Set it to true to enable the sweep." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Pruning ${ORG} (dry-run: ${DRY_RUN})"
          echo

          repos=$(gh api --paginate "orgs/${ORG}/repos?type=all&per_page=100" \
            --jq '.[] | select(.archived == false) | .full_name')

          if [ -z "${repos}" ]; then
            echo "::error::No repositories returned; refusing to report success over"
            echo "::error::an empty list."
            exit 1
          fi

          total=0; deleted=0; skipped=0

          while IFS= read -r repo; do
            default_branch=$(gh api "repos/${repo}" --jq '.default_branch')

            # Branches still referenced by an OPEN pr, whatever its state.
            open_heads=$(gh pr list --repo "${repo}" --state open --limit 200 \
              --json headRefName --jq '.[].headRefName' 2>/dev/null || true)

            # Merged PRs whose head branch lived in this repo. A fork's branch
            # is not ours to delete.
            merged_heads=$(gh pr list --repo "${repo}" --state merged --limit 200 \
              --json headRefName,headRepositoryOwner \
              --jq ".[] | select(.headRepositoryOwner.login == \"${ORG}\") | .headRefName" \
              2>/dev/null || true)

            [ -z "${merged_heads}" ] && continue

            while IFS= read -r branch; do
              [ -z "${branch}" ] && continue
              [ "${branch}" = "${default_branch}" ] && continue

              # Still open somewhere else? Leave it.
              if echo "${open_heads}" | grep -Fxq "${branch}"; then
                continue
              fi

              # Gone already -- the usual case once the setting is on.
              meta=$(gh api "repos/${repo}/branches/${branch}" 2>/dev/null || true)
              [ -z "${meta}" ] && continue

              if [ "$(echo "${meta}" | jq -r '.protected')" = "true" ]; then
                echo "skip      ${repo}#${branch} (protected)"
                skipped=$((skipped + 1))
                continue
              fi

              total=$((total + 1))

              if [ "${DRY_RUN}" = "true" ]; then
                echo "would rm  ${repo}#${branch}"
                continue
              fi

              if gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}" --silent 2>/dev/null; then
                echo "deleted   ${repo}#${branch}"
                deleted=$((deleted + 1))
              else
                echo "::warning::could not delete ${repo}#${branch}"
                skipped=$((skipped + 1))
              fi
            done <<< "${merged_heads}"
          done <<< "${repos}"

          echo
          echo "${total} candidates, ${deleted} deleted, ${skipped} skipped"
          {
            echo "### Merged-branch sweep"
            echo
            echo "- dry run: \`${DRY_RUN}\`"
            echo "- candidates: ${total}"
            echo "- deleted: ${deleted}"
            echo "- skipped: ${skipped}"
          } >> "${GITHUB_STEP_SUMMARY}"
