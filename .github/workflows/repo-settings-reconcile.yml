# Org-wide repository settings, reconciled.
#
# The policy lives in ../../settings.yml, not here. This file is only the
# runner. That split is on purpose: the policy is a document people argue
# with, and it belongs somewhere reviewable rather than inside a heredoc.
#
# WHY THIS EXISTS. GitHub has no org-level default for `allow_auto_merge`.
# There is no repository-defaults entry for it, and org rulesets govern merge
# *requirements* rather than whether the mechanism exists. So without this,
# every new repo starts with it off and nobody notices until something breaks
# on it -- which is exactly how agent-os ran a pipeline whose auto-merge step
# failed with `Resource not accessible by integration (mergePullRequest)`.
#
# A 2xx IS NOT EVIDENCE. GitHub accepts a settings PATCH, returns success, and
# silently discards fields the plan does not support. Measured 2026-09-02:
# this job reported "0 could not be written" across twenty repositories while
# allow_auto_merge had moved on none of them, because auto-merge is not
# available on private repositories below Pro. Every write is now read back.
#
# TOKEN. The default GITHUB_TOKEN is scoped to this repository and cannot
# write settings on others, so this needs `ORG_ADMIN_TOKEN` -- a fine-grained
# PAT or App installation token with Administration: write and
# Vulnerability alerts: write on the org's repositories. Administration: write
# is also what creating and updating repository rulesets needs.
#
# RULESETS. settings.yml's `rulesets:` block is written into every repository
# as a repository ruleset (the review gate: CodeRabbit approval, resolved
# conversations, green CI, no bypass for people). See the comments there for
# why it is per repository rather than one org ruleset.
#
# IT ALSO NEEDS contents: read, and forgetting that cost this job every
# scheduled run it ever had. See the per-job permissions block below.
name: repo-settings-reconcile

on:
  # EVENT-DRIVEN FIRST. Editing the policy IS the decision to apply it, so a
  # merge to settings.yml reconciles within seconds instead of waiting for
  # 04:00. Added 2026-09-02.
  push:
    branches: [main]
    paths:
      - settings.yml
  schedule:
    # Still nightly, and still worth having. The two drift sources this file
    # cannot see as events are a NEW repository appearing and someone editing
    # a setting in the UI. Both are organisation-level webhook events, and
    # GitHub Actions can only be triggered by events in its OWN repository --
    # so catching them needs an org webhook plus a receiver firing
    # repository_dispatch, not a trigger. Until that exists, the clock is the
    # fallback.
    #
    # Observed jitter on this cron has been up to six hours. Do not read
    # "0 4" as a promise, and do not bother staggering these by minutes.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the diff without writing anything.
        type: boolean
        default: true

permissions: {}

jobs:
  reconcile:
    name: Reconcile repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED, and its absence was a live defect. `permissions: {}` above sets
    # every scope to none, so actions/checkout could not read this PRIVATE
    # repository and failed with "Repository not found" -- GitHub returns 404
    # rather than 403 for an unauthorised private repo, which reads like the
    # repo is missing rather than like a permissions bug. The only scheduled
    # run this job ever had (2026-09-01T09:17:46Z) died there, silently, and
    # the estate went unreconciled with every indicator looking normal.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # Scheduled runs apply. A push to settings.yml applies, because
          # editing the policy and merging it IS the decision. Only a hand-run
          # defaults to reporting, so nobody discovers the blast radius by
          # causing it.
          DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'false' || inputs.dry-run }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_ADMIN_TOKEN is not set. The default GITHUB_TOKEN cannot"
            echo "::error::write settings on other repositories, so this job would"
            echo "::error::report success having changed nothing."
            exit 1
          fi

          POLICY=settings.yml
          [ -f "${POLICY}" ] || { echo "::error::${POLICY} is missing"; exit 1; }

          # yq ships on ubuntu-latest. Fail loudly rather than silently skipping.
          command -v yq >/dev/null || { echo "::error::yq not found on runner"; exit 1; }

          DESIRED=$(yq -o=json '.repository' "${POLICY}")
          WANT_ALERTS=$(yq -r '.security.dependabot_alerts // "unset"' "${POLICY}")
          WANT_FIXES=$(yq -r '.security.dependabot_security_updates // "unset"' "${POLICY}")
          KEYS=$(echo "${DESIRED}" | jq -r 'keys | join(",")')

          echo "Reconciling ${ORG} (event: ${GITHUB_EVENT_NAME}, dry-run: ${DRY_RUN})"
          echo "policy: $(echo "${DESIRED}" | jq -c .)"
          echo "dependabot alerts: ${WANT_ALERTS} | security updates: ${WANT_FIXES}"
          echo

          repos=$(gh api --paginate "orgs/${ORG}/repos?type=all&per_page=100" \
            --jq '.[] | select(.archived == false) | .full_name')

          if [ -z "${repos}" ]; then
            echo "::error::No repositories returned. Either the org is empty or the"
            echo "::error::token cannot see it. Refusing to report success over an"
            echo "::error::empty list -- a reconciler that converges on nothing looks"
            echo "::error::exactly like one that is working."
            exit 1
          fi

          # --- rulesets: setup ---------------------------------------------
          # App slugs in the policy (bypass apps, and the app pinned to each
          # required check) become numeric IDs here, once, rather than being
          # copied into settings.yml as magic numbers. github-actions is always
          # resolved because per-repository CI checks are pinned to it. A slug
          # that does not resolve stops the run: a ruleset pinned to the wrong
          # app blocks every merge, and a bypass for the wrong app is a hole.
          RULESETS=$(yq -o=json '.rulesets // {}' "${POLICY}")
          slugs=$(echo "${RULESETS}" | jq -r \
            '[.[] | (.bypass_apps // [])[], ((.required_checks.everywhere // [])[] | .app // empty)] + ["github-actions"] | unique | .[]')
          APP_IDS='{}'
          for slug in ${slugs}; do
            id=$(gh api "apps/${slug}" --jq .id) || { echo "::error::cannot resolve GitHub App '${slug}'"; exit 1; }
            APP_IDS=$(echo "${APP_IDS}" | jq --arg s "${slug}" --argjson i "${id}" '. + {($s): $i}')
          done
          echo "rulesets: $(echo "${RULESETS}" | jq -r 'keys | join(", ")') | apps: $(echo "${APP_IDS}" | jq -c .)"
          echo

          # One ruleset from the policy, for one repository, in the shape the
          # rulesets API takes.
          build_ruleset() {
            jq -n --arg name "$1" --arg repo "$2" --argjson p "$3" --argjson apps "${APP_IDS}" '
              ( [ ($p.required_checks.everywhere // [])[]
                  | {context, integration_id: $apps[.app // "github-actions"]} ]
              + [ ($p.required_checks.per_repo[$repo] // [])[]
                  | {context: ., integration_id: $apps["github-actions"]} ] ) as $checks
              | {
                  name: $name,
                  target: "branch",
                  enforcement: $p.enforcement,
                  conditions: {ref_name: {include: $p.branches, exclude: []}},
                  bypass_actors: [ ($p.bypass_apps // [])[]
                    | {actor_id: $apps[.], actor_type: "Integration", bypass_mode: "pull_request"} ],
                  rules: (
                      (if $p.pull_request then [{type: "pull_request", parameters: $p.pull_request}] else [] end)
                    + (if ($checks | length) > 0 then [{type: "required_status_checks", parameters: {
                          strict_required_status_checks_policy: ($p.required_checks.strict // false),
                          required_status_checks: $checks}}] else [] end)
                    + (if $p.block_force_push then [{type: "non_fast_forward"}] else [] end)
                    + (if $p.block_deletion then [{type: "deletion"}] else [] end))
                }'
          }

          # Does the ruleset GitHub holds ($2) enforce everything the policy
          # asks for ($1)? GitHub adds defaults of its own to what it returns,
          # so this compares only the fields the policy sets, rather than whole
          # objects, which would never match.
          ruleset_matches() {
            jq -n --argjson want "$1" --argjson have "$2" '
              def checks: map({context, integration_id}) | sort_by(.context, .integration_id);
              def actors: map({actor_id, actor_type, bypass_mode}) | sort_by(.actor_id);
              def rule_ok($rules):
                . as $w
                | ($rules | map(select(.type == $w.type)) | first) as $h
                | $h != null
                  and (($w.parameters // {}) | to_entries | all(
                        .key as $k | .value as $v | ($h.parameters // {})[$k] as $hv
                        | if $k == "required_status_checks" then ($v | checks) == (($hv // []) | checks)
                          elif ($v | type) == "array" then ($v | sort) == (($hv // []) | sort)
                          else $v == $hv end));
              $want.enforcement == $have.enforcement
              and $want.target == $have.target
              and ($want.conditions.ref_name.include | sort) == (($have.conditions.ref_name.include // []) | sort)
              and ($want.bypass_actors | actors) == (($have.bypass_actors // []) | actors)
              and ($want.rules | map(.type) | sort) == (($have.rules // []) | map(.type) | sort)
              and ($want.rules | all(rule_ok($have.rules // [])))'
          }

          total=0; changed=0; failed=0; blocked=0

          # $1 verb, $2 path, $3 label. Warns rather than stopping: one repo
          # refusing a write must not hide the other nineteen.
          apply() {
            if [ "${DRY_RUN}" = "true" ]; then return 0; fi
            if gh api -X "$1" "$2" --silent 2>/dev/null; then
              echo "  applied   $3"
            else
              echo "::warning::could not $3 on $2"
              failed=$((failed + 1))
            fi
          }

          while IFS= read -r repo; do
            total=$((total + 1))
            note=""

            # --- merge settings -------------------------------------------
            current=$(gh api "repos/${repo}" --jq "{${KEYS}}")

            # Only the keys that differ. A full-object PATCH is how the
            # documented "updating a repository through the API disables
            # auto-merge" foot-gun happens: omitted fields get reset.
            diff=$(jq -n --argjson cur "${current}" --argjson want "${DESIRED}" \
              '$want | with_entries(select(.value != $cur[.key]))')

            if [ "${diff}" != "{}" ]; then
              note="merge:$(echo "${diff}" | jq -c .)"
              if [ "${DRY_RUN}" != "true" ]; then
                if echo "${diff}" | gh api -X PATCH "repos/${repo}" --input - >/dev/null 2>&1; then
                  # READ BACK. The PATCH returning 2xx does not mean the field
                  # changed: GitHub silently drops settings the plan does not
                  # support, and allow_auto_merge on a private repo below Pro
                  # is the live example across all twenty of these.
                  after=$(gh api "repos/${repo}" --jq "{${KEYS}}")
                  stuck=$(jq -rn --argjson cur "${after}" --argjson want "${DESIRED}" \
                    '$want | with_entries(select(.value != $cur[.key])) | keys | join(",")')
                  if [ -n "${stuck}" ]; then
                    note="${note} NOT-APPLIED:${stuck}"
                    blocked=$((blocked + 1))
                  fi
                else
                  echo "::warning::could not patch merge settings on ${repo}"
                  failed=$((failed + 1))
                fi
              fi
            fi

            # --- dependabot alerts (detection) ----------------------------
            # Renovate's vulnerabilityAlerts fast-path reads these. Off means
            # that whole path is inert and silent.
            if [ "${WANT_ALERTS}" = "enabled" ]; then
              if gh api "repos/${repo}/vulnerability-alerts" --silent 2>/dev/null; then
                :
              else
                note="${note} alerts:off"
                apply PUT "repos/${repo}/vulnerability-alerts" "enable dependabot alerts"
              fi
            fi

            # --- dependabot security updates (remediation) ----------------
            # Renovate owns this. Two bots racing on one CVE leaves a stale
            # branch behind whichever loses.
            if [ "${WANT_FIXES}" = "disabled" ]; then
              state=$(gh api "repos/${repo}" \
                --jq '.security_and_analysis.dependabot_security_updates.status // "unknown"' 2>/dev/null || echo unknown)
              if [ "${state}" = "enabled" ]; then
                note="${note} securityupdates:on(renovate-owns-this)"
                apply DELETE "repos/${repo}/automated-security-fixes" "disable dependabot security updates"
              fi
            fi

            # --- secret scanning: reported, never written -----------------
            ss=$(gh api "repos/${repo}" \
              --jq '.security_and_analysis.secret_scanning.status // "unavailable"' 2>/dev/null || echo unavailable)
            [ "${ss}" = "enabled" ] || note="${note} secretscanning:${ss}"

            # --- rulesets (the merge gate) ---------------------------------
            # Created if missing, replaced if it differs from the policy, then
            # read back, because a 2xx is not evidence. A Free-plan private
            # repository refuses rulesets outright; that is PLAN-BLOCKED, not
            # a failure, for the same reason as a plan-refused merge setting.
            for rs in $(echo "${RULESETS}" | jq -r 'keys[]'); do
              pol=$(echo "${RULESETS}" | jq --arg k "${rs}" '.[$k]')
              want=$(build_ruleset "${rs}" "${repo#*/}" "${pol}")
              # A repo with no CI checks declared is a known policy state, not drift:
              # reported on every run, but not counted.
              if [ "$(echo "${pol}" | jq --arg r "${repo#*/}" '.required_checks.per_repo | has($r)')" != "true" ]; then
                echo "info      ${repo}: ruleset:${rs}:no-ci-checks"
              fi

              if ! list=$(gh api "repos/${repo}/rulesets?includes_parents=false&per_page=100" 2>&1); then
                if grep -q "Upgrade to GitHub" <<< "${list}"; then
                  note="${note} ruleset:${rs}:PLAN-BLOCKED"
                  blocked=$((blocked + 1))
                else
                  echo "::warning::could not list rulesets on ${repo}: ${list}"
                  failed=$((failed + 1))
                fi
                continue
              fi
              rs_id=$(echo "${list}" | jq -r --arg n "${rs}" '[.[] | select(.name == $n and .source_type == "Repository")][0].id // empty')

              if [ -n "${rs_id}" ]; then
                have=$(gh api "repos/${repo}/rulesets/${rs_id}")
                if [ "$(ruleset_matches "${want}" "${have}")" = "true" ]; then
                  continue
                fi
                verb=PUT; path="repos/${repo}/rulesets/${rs_id}"; note="${note} ruleset:${rs}:update"
              else
                verb=POST; path="repos/${repo}/rulesets"; note="${note} ruleset:${rs}:create"
              fi
              if [ "${DRY_RUN}" = "true" ]; then
                continue
              fi

              if ! out=$(echo "${want}" | gh api -X "${verb}" "${path}" --input - 2>&1); then
                if grep -q "Upgrade to GitHub" <<< "${out}"; then
                  note="${note}(PLAN-BLOCKED)"
                  blocked=$((blocked + 1))
                else
                  echo "::warning::could not ${verb} ruleset ${rs} on ${repo}: ${out}"
                  failed=$((failed + 1))
                fi
                continue
              fi
              # READ BACK what GitHub now holds, and check it enforces what
              # was asked.
              rs_id=$(echo "${out}" | jq -r '.id')
              have=$(gh api "repos/${repo}/rulesets/${rs_id}")
              if [ "$(ruleset_matches "${want}" "${have}")" = "true" ]; then
                echo "  applied   ruleset ${rs}"
              else
                note="${note}(NOT-APPLIED)"
                echo "::warning::ruleset ${rs} on ${repo} was accepted but does not match the policy"
                failed=$((failed + 1))
              fi
            done

            if [ -z "${note}" ]; then
              echo "ok        ${repo}"
            else
              changed=$((changed + 1))
              echo "drift     ${repo}: ${note}"
            fi
          done <<< "${repos}"

          echo
          echo "${total} repositories, ${changed} drifted, ${failed} could not be written, ${blocked} had keys the plan refuses"
          {
            echo "### Repository policy reconcile"
            echo
            echo "- org: \`${ORG}\`"
            echo "- trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- dry run: \`${DRY_RUN}\`"
            echo "- repositories: ${total}"
            echo "- drifted: ${changed}"
            echo "- failed to write: ${failed}"
            echo "- keys silently refused by GitHub: ${blocked}"
            echo
            echo "Policy source: \`settings.yml\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          # A run that could not write what it found is not a success. A key
          # the PLAN forbids is different: no token can change it, and failing
          # nightly over it would make this permanently red, which is how a
          # check stops being read. Reported loudly, not fatal.
          if [ "${failed}" -gt 0 ] && [ "${DRY_RUN}" != "true" ]; then
            exit 1
          fi
