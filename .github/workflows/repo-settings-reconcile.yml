# Org-wide repository settings, reconciled.
#
# The policy lives in ../../settings.yml, not here. This file is only the
# runner. That split is on purpose: the policy is a document people argue
# with, and it belongs somewhere reviewable rather than inside a heredoc.
#
# WHY THIS EXISTS. GitHub has no org-level default for `allow_auto_merge`.
# There is no repository-defaults entry for it, and org rulesets govern merge
# *requirements* rather than whether the mechanism exists. So without this,
# every new repo starts with it off and nobody notices until something breaks
# on it -- which is exactly how agent-os ran a pipeline whose auto-merge step
# failed with `Resource not accessible by integration (mergePullRequest)`.
#
# WHAT IS NATIVE INSTEAD. Dependabot alerts *do* have an org-level control:
# Organization Settings -> Code security. Set them there as the primary
# mechanism; this job then verifies rather than assumes, which is the whole
# lesson of the settings-shaped defects this estate has already hit.
#
# TOKEN. The default GITHUB_TOKEN is scoped to this repository and cannot
# write settings on others, so this needs `ORG_ADMIN_TOKEN` -- a fine-grained
# PAT or App installation token with Administration: write and
# Vulnerability alerts: write on the org's repositories.
#
# IT ALSO NEEDS contents: read, and forgetting that cost this job every
# scheduled run it ever had. See the per-job permissions block below.
name: repo-settings-reconcile

on:
  # EVENT-DRIVEN FIRST. Editing the policy IS the decision to apply it, so a
  # merge to settings.yml reconciles within seconds instead of waiting for
  # 04:00. Added 2026-09-02.
  push:
    branches: [main]
    paths:
      - settings.yml
  schedule:
    # Still nightly, and still worth having. The two drift sources this file
    # cannot see as events are a NEW repository appearing and someone editing
    # a setting in the UI. Both are organisation-level webhook events, and
    # GitHub Actions can only be triggered by events in its OWN repository --
    # so catching them needs an org webhook plus a receiver firing
    # repository_dispatch, not a trigger. Until that exists, the clock is the
    # fallback.
    #
    # Observed jitter on this cron has been up to six hours. Do not read
    # "0 4" as a promise, and do not bother staggering these by minutes.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report the diff without writing anything.
        type: boolean
        default: true

permissions: {}

jobs:
  reconcile:
    name: Reconcile repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED, and its absence was a live defect. `permissions: {}` above sets
    # every scope to none, so actions/checkout could not read this PRIVATE
    # repository and failed with "Repository not found" -- GitHub returns 404
    # rather than 403 for an unauthorised private repo, which reads like the
    # repo is missing rather than like a permissions bug. The only scheduled
    # run this job ever had (2026-09-01T09:17:46Z) died there, silently, and
    # the estate went unreconciled with every indicator looking normal.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # Scheduled runs apply. A push to settings.yml applies, because
          # editing the policy and merging it IS the decision. Only a hand-run
          # defaults to reporting, so nobody discovers the blast radius by
          # causing it.
          DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'false' || inputs.dry-run }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_ADMIN_TOKEN is not set. The default GITHUB_TOKEN cannot"
            echo "::error::write settings on other repositories, so this job would"
            echo "::error::report success having changed nothing."
            exit 1
          fi

          POLICY=settings.yml
          [ -f "${POLICY}" ] || { echo "::error::${POLICY} is missing"; exit 1; }

          # yq ships on ubuntu-latest. Fail loudly rather than silently skipping.
          command -v yq >/dev/null || { echo "::error::yq not found on runner"; exit 1; }

          DESIRED=$(yq -o=json '.repository' "${POLICY}")
          WANT_ALERTS=$(yq -r '.security.dependabot_alerts // "unset"' "${POLICY}")
          WANT_FIXES=$(yq -r '.security.dependabot_security_updates // "unset"' "${POLICY}")

          echo "Reconciling ${ORG} (event: ${GITHUB_EVENT_NAME}, dry-run: ${DRY_RUN})"
          echo "policy: $(echo "${DESIRED}" | jq -c .)"
          echo "dependabot alerts: ${WANT_ALERTS} | security updates: ${WANT_FIXES}"
          echo

          repos=$(gh api --paginate "orgs/${ORG}/repos?type=all&per_page=100" \
            --jq '.[] | select(.archived == false) | .full_name')

          if [ -z "${repos}" ]; then
            echo "::error::No repositories returned. Either the org is empty or the"
            echo "::error::token cannot see it. Refusing to report success over an"
            echo "::error::empty list -- a reconciler that converges on nothing looks"
            echo "::error::exactly like one that is working."
            exit 1
          fi

          total=0; changed=0; failed=0

          # $1 verb, $2 path, $3 label. Warns rather than stopping: one repo
          # refusing a write must not hide the other nineteen.
          apply() {
            if [ "${DRY_RUN}" = "true" ]; then return 0; fi
            if gh api -X "$1" "$2" --silent 2>/dev/null; then
              echo "  applied   $3"
            else
              echo "::warning::could not $3 on $2"
              failed=$((failed + 1))
            fi
          }

          while IFS= read -r repo; do
            total=$((total + 1))
            note=""

            # --- merge settings -------------------------------------------
            keys=$(echo "${DESIRED}" | jq -r 'keys | join(",")')
            current=$(gh api "repos/${repo}" --jq "{$(echo "${keys}" | tr ',' '\n' | sed 's/.*/&/' | paste -sd, -)}")

            # Only the keys that differ. A full-object PATCH is how the
            # documented "updating a repository through the API disables
            # auto-merge" foot-gun happens: omitted fields get reset.
            diff=$(jq -n --argjson cur "${current}" --argjson want "${DESIRED}" \
              '$want | with_entries(select(.value != $cur[.key]))')

            if [ "${diff}" != "{}" ]; then
              note="merge:$(echo "${diff}" | jq -c .)"
              if [ "${DRY_RUN}" != "true" ]; then
                if echo "${diff}" | gh api -X PATCH "repos/${repo}" --input - >/dev/null 2>&1; then
                  :
                else
                  echo "::warning::could not patch merge settings on ${repo}"
                  failed=$((failed + 1))
                fi
              fi
            fi

            # --- dependabot alerts (detection) ----------------------------
            # Renovate's vulnerabilityAlerts fast-path reads these. Off means
            # that whole path is inert and silent.
            if [ "${WANT_ALERTS}" = "enabled" ]; then
              if gh api "repos/${repo}/vulnerability-alerts" --silent 2>/dev/null; then
                :
              else
                note="${note} alerts:off"
                apply PUT "repos/${repo}/vulnerability-alerts" "enable dependabot alerts"
              fi
            fi

            # --- dependabot security updates (remediation) ----------------
            # Renovate owns this. Two bots racing on one CVE leaves a stale
            # branch behind whichever loses.
            if [ "${WANT_FIXES}" = "disabled" ]; then
              state=$(gh api "repos/${repo}" \
                --jq '.security_and_analysis.dependabot_security_updates.status // "unknown"' 2>/dev/null || echo unknown)
              if [ "${state}" = "enabled" ]; then
                note="${note} securityupdates:on(renovate-owns-this)"
                apply DELETE "repos/${repo}/automated-security-fixes" "disable dependabot security updates"
              fi
            fi

            # --- secret scanning: reported, never written -----------------
            ss=$(gh api "repos/${repo}" \
              --jq '.security_and_analysis.secret_scanning.status // "unavailable"' 2>/dev/null || echo unavailable)
            [ "${ss}" = "enabled" ] || note="${note} secretscanning:${ss}"

            if [ -z "${note}" ]; then
              echo "ok        ${repo}"
            else
              changed=$((changed + 1))
              echo "drift     ${repo}: ${note}"
            fi
          done <<< "${repos}"

          echo
          echo "${total} repositories, ${changed} drifted, ${failed} could not be written"
          {
            echo "### Repository policy reconcile"
            echo
            echo "- org: \`${ORG}\`"
            echo "- trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- dry run: \`${DRY_RUN}\`"
            echo "- repositories: ${total}"
            echo "- drifted: ${changed}"
            echo "- failed to write: ${failed}"
            echo
            echo "Policy source: \`settings.yml\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          # A run that could not write what it found is not a success.
          if [ "${failed}" -gt 0 ] && [ "${DRY_RUN}" != "true" ]; then
            exit 1
          fi
