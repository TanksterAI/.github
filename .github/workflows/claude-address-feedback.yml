# Reusable Claude feedback-resolution loop.
#
# Fires when CodeRabbit or claude-review.yml leave comments on a PR. Reads
# every unresolved review thread, fixes what's real, resolves what it fixed,
# replies (without resolving) to what it disagrees with, and pushes.
#
# Pushing under the Claude GitHub App's own identity -- not this job's
# default GITHUB_TOKEN -- is deliberate: GitHub does not re-run workflows on
# commits authored by the default GITHUB_TOKEN, which would silently break
# the loop (no re-triggered CI, no re-triggered review) on every fix it
# made. Do not add a github_token input here for that reason. See
# https://code.claude.com/docs/en/github-actions#ci-not-running-on-claudes-commits.
#
# Self-terminating by construction: nothing left to fix means no commit,
# means no push, means no new pull_request `synchronize` event, means the
# chain ends on its own. No iteration-round cap is enforced here
# deliberately -- the TanksterAI org ruleset (required status checks +
# require all conversations resolved) is what actually gates merge, not a
# round counter. A single run is still bounded by timeout-minutes below as
# ordinary runaway-job hygiene, same as every other workflow in this repo.
#
# Checkout mirrors Anthropic's own documented issue_comment /
# pull_request_review example workflow (no manual ref resolution) --
# claude-code-action resolves the correct PR head itself. fetch-depth is 0
# rather than their 1, because this job's prompt can be asked to merge or
# rebase against a moved base, which needs history.
name: claude-address-feedback

on:
  workflow_call:
    inputs:
      allowed-bots:
        description: >-
          Comma-separated bot logins allowed to trigger this workflow. Add a
          new reviewer bot's login here when one is introduced.
        type: string
        default: "coderabbitai[bot],claude[bot]"
      timeout-minutes:
        type: number
        default: 30
    secrets:
      anthropic-api-key:
        required: true

permissions:
  contents: read

jobs:
  address:
    name: Address feedback
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.state != 'approved' &&
       contains(fromJSON('["coderabbitai[bot]","claude[bot]"]'), github.event.review.user.login)) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(fromJSON('["coderabbitai[bot]","claude[bot]"]'), github.event.comment.user.login))
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          allowed_bots: ${{ inputs.allowed-bots }}
          prompt: |
            Read every unresolved review thread and unaddressed review comment
            on this pull request, from CodeRabbit and from your own prior
            review.

            For each one that identifies a real issue: fix it in the code,
            then resolve that review thread. If a comment is a false
            positive or out of scope, reply explaining why instead of
            resolving it.

            If the branch is behind its base, bring it up to date yourself
            (merge or rebase, your judgment) and resolve any textual
            conflicts before pushing -- do not leave a conflicted branch for
            a human.

            When everything addressable is addressed, commit with a clear
            message and push. If there is nothing left to fix, do not push
            an empty commit -- just stop.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(git:*),Bash(gh:*)"
