# This repository's own CI. A broken workflow here breaks every consuming repo
# at once, so it lints itself before anything can merge.
name: self-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: self-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          latest=$(
            curl -fsSL --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/rhysd/actionlint/releases/latest \
              | grep -m1 -oE '"tag_name"[[:space:]]*:[[:space:]]*"v[0-9]+\.[0-9]+\.[0-9]+"' \
              | sed -E 's/.*"(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/'
          ) || true
          [ -n "${latest:-}" ] || latest="v1.7.7"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/${latest}/actionlint_${latest#v}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint workflows
        run: actionlint -color

  presets:
    name: Renovate presets
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate preset JSON
        run: |
          set -euo pipefail
          for f in ./*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok  $f"
          done

      # A preset that extends a repo path that does not exist fails silently at
      # Renovate run time, on every consuming repo, with no PR to notice.
      - name: Check preset cross-references resolve
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r ref; do
            preset="${ref##*:}"
            if [ "$preset" = "$ref" ]; then
              target="default.json"
            else
              target="${preset}.json"
            fi
            if [ ! -f "$target" ]; then
              echo "::error::preset reference '$ref' resolves to missing file '$target'"
              fail=1
            else
              echo "ok  $ref -> $target"
            fi
          # Anchored to a strict github>owner/repo(:preset)? charset so a
          # description string that merely *mentions* a reference (with a
          # trailing sentence period, or a backslash-escaped quote from JSON
          # like "...\"github>owner/repo:node\".") can't be swept in as if it
          # were a real cross-reference — grep -o's old `[^"]*` matched right
          # up to the next literal `"`, which an escaped `\"` isn't.
          done < <(grep -hoE 'github>[A-Za-z0-9._/-]+(:[A-Za-z0-9_-]+)?' ./*.json | sort -u)
          exit $fail

  # The reconciler and the org-wide auto-merge workflow change every
  # repository at once, so their shell is tested here, against a mock `gh`,
  # before it can merge. The tests extract the real `run:` blocks with yq.
  tests:
    name: Scenario tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: |
          set -euo pipefail
          # yq ships on ubuntu-latest and in the fallback runner's image.
          for t in yq jq python3; do command -v "$t" >/dev/null || { echo "::error::$t not found on runner"; exit 1; }; done
          yq --version

      - name: repo-settings-reconcile
        run: bash tests/reconcile/test.sh .

      - name: org-auto-merge
        run: bash tests/org-auto-merge/test.sh .

  # The one check the org-wide `ci-gate` ruleset requires. It passes only when every
  # CI job listed in `needs` succeeded or was deliberately skipped, so the org rule
  # never needs to know this repo's job names. Add new CI jobs to `needs`.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [actionlint, presets, tests]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All required CI jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' >/dev/null \
            || { echo "::error::A required CI job failed or was cancelled:"; echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'; exit 1; }
