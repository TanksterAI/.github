# This repository's own CI. A broken workflow here breaks every consuming repo
# at once, so it lints itself before anything can merge.
#
# Two jobs, pull requests only, since Oct 2026. It used to be four jobs on
# every pull request and again on the push to main after the merge:
#   - a standalone actionlint job, which the workflows-lint call below already
#     runs (same tool, same files), so actionlint ran twice;
#   - the push to main re-checked a tree the pull request had just checked
#     (squash merges only, and the ruleset requires the branch be up to date);
#   - presets and the runner-guard fixtures were separate VMs for a few
#     seconds of work each, billed a whole minute apiece.
# Only CodeRabbit is a required check here, so the path filter cannot leave a
# docs-only pull request waiting on a check that never runs.
name: self-check

on:
  pull_request:
    paths:
      - ".github/**"
      - "*.json"
      - "tests/**"
      - "test/**"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: self-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  presets:
    name: Renovate presets, runner guard and light-lane lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate preset JSON
        run: |
          set -euo pipefail
          for f in ./*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok  $f"
          done

      # A preset that extends a repo path that does not exist fails silently at
      # Renovate run time, on every consuming repo, with no PR to notice.
      - name: Check preset cross-references resolve
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r ref; do
            preset="${ref##*:}"
            if [ "$preset" = "$ref" ]; then
              target="default.json"
            else
              target="${preset}.json"
            fi
            if [ ! -f "$target" ]; then
              echo "::error::preset reference '$ref' resolves to missing file '$target'"
              fail=1
            else
              echo "ok  $ref -> $target"
            fi
          # Anchored to a strict github>owner/repo(:preset)? charset so a
          # description string that merely *mentions* a reference (with a
          # trailing sentence period, or a backslash-escaped quote from JSON
          # like "...\"github>owner/repo:node\".") can't be swept in as if it
          # were a real cross-reference — grep -o's old `[^"]*` matched right
          # up to the next literal `"`, which an escaped `\"` isn't.
          done < <(grep -hoE 'github>[A-Za-z0-9._/-]+(:[A-Za-z0-9_-]+)?' ./*.json | sort -u)
          exit $fail

      # security.yml pins osv-scanner and gitleaks by version and SHA-256, and
      # Renovate bumps only the version: this fails such a pull request until
      # the checksum is the one the release publishes.
      - name: Scanner checksums match their releases
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          wf=.github/workflows/security.yml
          get() { yq ".on.workflow_call.inputs.\"$1\".default" "$wf"; }
          sums() { curl -fsSL --retry 3 "$1" | awk -v f="$2" '$2 == f { print $1 }'; }
          fail=0
          check() {
            if [ -n "$3" ] && [ "$3" = "$4" ]; then
              echo "ok  $1 v$2"
            else
              echo "::error file=${wf}::$1 v$2: its SHA-256 input should be ${3:-<not in the release checksums>}"
              fail=1
            fi
          }
          v="$(get osv-version)"
          check osv-scanner "$v" \
            "$(sums "https://github.com/google/osv-scanner/releases/download/v${v}/osv-scanner_SHA256SUMS" osv-scanner_linux_amd64)" \
            "$(get osv-sha256)"
          v="$(get gitleaks-version)"
          check gitleaks "$v" \
            "$(sums "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt" "gitleaks_${v}_linux_x64.tar.gz")" \
            "$(get gitleaks-sha256)"
          exit "$fail"

      # Runs the runner guard's own script, taken straight from
      # workflows-lint.yml, over tests/runner-guard. It must report exactly the
      # lines marked expect-flag, with the right line numbers, and the error
      # policy must fail on them.
      - name: Run the guard over its fixtures
        # Reports even when a preset check above failed, as its own job did.
        if: ${{ !cancelled() }}
        working-directory: tests/runner-guard
        run: |
          set -euo pipefail
          guard="${RUNNER_TEMP}/guard.sh"
          yq '.jobs.actionlint.steps[] | select(.name == "Runners follow CI_RUNNER") | .run' \
            ../../.github/workflows/workflows-lint.yml > "${guard}"
          test -s "${guard}"
          POLICY=warning bash "${guard}" > "${RUNNER_TEMP}/out.txt"
          # Shown defused, so the fixtures' findings do not annotate this PR.
          sed 's/^::/: :/' "${RUNNER_TEMP}/out.txt"
          grep -oE 'file=[^,]+,line=[0-9]+' "${RUNNER_TEMP}/out.txt" \
            | sed -E 's/^file=([^,]+),line=/\1:/' | sort > "${RUNNER_TEMP}/got"
          grep -rnE '#[[:space:]]*expect-flag[[:space:]]*$' .github/workflows \
            | cut -d: -f1,2 | sort > "${RUNNER_TEMP}/want"
          diff -u "${RUNNER_TEMP}/want" "${RUNNER_TEMP}/got"
          if POLICY=error bash "${guard}" > /dev/null; then
            echo "::error::runner-policy error did not fail on hard-coded runners"
            exit 1
          fi
          echo "ok  $(wc -l < "${RUNNER_TEMP}/want") expected findings, no others"

      # The light-lane lint's script, taken straight from workflows-lint.yml
      # like the guard above, against tests/light-lane: passing and failing
      # fixtures, a stand-in for the GitHub API, and the check that a closed
      # lane leaves every job on the runner it had before.
      - name: Test the light-lane lint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          export LIGHT_LANE_LINT="${RUNNER_TEMP}/light_lane_lint.py"
          yq '.jobs.actionlint.steps[] | select(.name == "Light jobs stay Docker-free") | .run' \
            .github/workflows/workflows-lint.yml > "${LIGHT_LANE_LINT}"
          test -s "${LIGHT_LANE_LINT}"
          python3 -m unittest discover -s tests/light-lane -v

  # The whole reusable workflow, as consumers get it, over this repository.
  workflows-lint:
    name: workflows-lint
    uses: ./.github/workflows/workflows-lint.yml
