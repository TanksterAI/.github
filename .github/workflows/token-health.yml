# Warns before ORG_ADMIN_TOKEN expires, rather than after.
#
# repo-settings-reconcile.yml and branch-prune.yml both run on
# ORG_ADMIN_TOKEN. A fine-grained PAT expires; when it does, the reconciler
# fails on its first API call at 03:00, nobody is awake, and the estate drifts
# silently until somebody notices twenty repositories disagreeing with
# settings.yml. That failure is loud in the Actions tab and invisible
# everywhere a person actually looks.
#
# THE MISSING HEADER IS THE HEALTHY CASE. GitHub returns
# `github-authentication-token-expiration` for fine-grained PATs. A GitHub App
# installation token does not carry it, because it does not expire in the
# sense this check cares about. So this workflow passes permanently once the
# org migrates to an App -- see docs/github-app-migration.md. It retires
# itself rather than needing someone to remember to delete it.
#
# ...but ONLY when the API call actually succeeded. See the guard below. The
# first version of this file read `gh api -i user 2>/dev/null` and treated an
# empty result as the App case, which is exactly inverted: a REVOKED token is
# the likeliest reason for an empty result, and it was reported with a white
# tick. A check that lies in the direction of health is worse than no check.
# Fixed 2026-09-02.
name: token-health

on:
  schedule:
    # Early enough that a warning is read on the same working day.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check ORG_ADMIN_TOKEN expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          # Two weeks, so a warning survives a holiday.
          MIN_DAYS: "14"
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ORG_ADMIN_TOKEN is not set. repo-settings-reconcile"
            echo "::error::and branch-prune cannot run without it."
            exit 1
          fi

          # THE CALL MUST SUCCEED BEFORE ITS SILENCE MEANS ANYTHING.
          # stderr is left attached on purpose so a failure is readable in the
          # log rather than swallowed by 2>/dev/null.
          if ! response=$(gh api -i user); then
            echo "::error::gh api user failed. ORG_ADMIN_TOKEN is most likely"
            echo "::error::revoked, expired, or lacking scope. This is NOT the"
            echo "::error::missing-header case and must never be read as one."
            exit 1
          fi

          # A non-2xx that gh did not surface as an error still must not pass.
          if ! printf '%s' "${response}" | head -1 | grep -qE '^HTTP/[0-9.]+ 2[0-9][0-9]'; then
            echo "::error::Unexpected status from gh api user:"
            printf '%s' "${response}" | head -1
            exit 1
          fi

          headers=$(printf '%s' "${response}" | sed -n '1,/^\r*$/p')

          expiry=$(printf '%s' "${headers}" \
            | grep -i '^github-authentication-token-expiration:' \
            | sed 's/^[^:]*: *//' | tr -d '\r' || true)

          if [ -z "${expiry}" ]; then
            echo "Call succeeded, and no expiration header was returned."
            echo "That is the GitHub App installation token case, and it is the"
            echo "outcome this repository is aiming for. Nothing to do."
            {
              echo "### Token health"
              echo
              echo "Call succeeded; no expiry header -- token does not expire. :white_check_mark:"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "Expires: ${expiry}"

          # The header is e.g. "2026-09-01 21:31:43 UTC". date -d handles it.
          expiry_epoch=$(date -u -d "${expiry}" +%s 2>/dev/null || echo "")
          if [ -z "${expiry_epoch}" ]; then
            # Failing, not warning. A check that cannot read its own input has
            # verified nothing, and passing here would quietly degrade this
            # into a permanently green job the day the header format changes.
            echo "::error::Could not parse expiry '${expiry}'. The header format"
            echo "::error::may have changed. Refusing to report health from an"
            echo "::error::input this job could not read."
            exit 1
          fi

          now_epoch=$(date -u +%s)
          days=$(( (expiry_epoch - now_epoch) / 86400 ))

          {
            echo "### Token health"
            echo
            echo "- expires: \`${expiry}\`"
            echo "- days remaining: **${days}**"
            echo
            echo "Stop needing this: [docs/github-app-migration.md](../blob/main/docs/github-app-migration.md)"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${days}" -lt 0 ]; then
            echo "::error::ORG_ADMIN_TOKEN EXPIRED ${days#-} days ago. The nightly"
            echo "::error::reconciler has not been applying settings since then."
            exit 1
          fi

          if [ "${days}" -lt "${MIN_DAYS}" ]; then
            echo "::error::ORG_ADMIN_TOKEN expires in ${days} days. Rotate it, or"
            echo "::error::migrate to a GitHub App and stop doing this forever:"
            echo "::error::docs/github-app-migration.md"
            exit 1
          fi

          echo "${days} days remaining. Healthy."
