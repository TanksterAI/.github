# Reusable auto-merge gate.
#
# Turns auto-merge on for every PR into the default branch the moment it's
# opened, unless it carries the opt-out label -- and turns it back off if
# that label is added later, or on again if the label is removed.
#
# The actual merge timing is entirely governed by the TanksterAI org ruleset
# (required status checks + require all conversations resolved), not by
# anything in this file: this file only flips the one switch GitHub
# rulesets don't cover -- the per-PR opt-in that `gh pr merge --auto`
# requires -- and never merges anything itself.
#
# Requires the repository's own "Allow auto-merge" setting to already be on
# (Settings -> General -> Pull Requests). Until that's flipped, this job
# fails loudly and visibly on every PR -- expected, not a bug, during
# rollout before that repo setting is turned on.
name: auto-merge-gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label. Empty (the default) follows the organisation's
          CI_RUNNER variable, which moves CI onto the Cloud Build fallback
          runner when the included Actions minutes run out, and means
          ubuntu-latest when that variable is unset. A value here also
          overrides light.
        type: string
        default: ""
      light:
        description: >-
          Run on the Cloud Run light runner, which has no Docker, once the
          organisation opens the light lane (CI_LIGHT_RUNNER is
          tankster-light). Until then, or when runs-on is set, it changes
          nothing. Nothing in this workflow needs Docker, and it sends far
          less than the 64 MiB the light runner allows a job; false keeps
          it off the lane anyway.
        type: boolean
        default: true
      merge-method:
        description: squash, merge, or rebase. Must be enabled in the repo's own merge-button settings.
        type: string
        default: squash
      label:
        description: Label that opts a PR out of auto-merge.
        type: string
        default: needs-human-review

permissions:
  contents: read

jobs:
  gate:
    name: Set auto-merge
    # Only PRs into the default branch: that is the branch the org ruleset
    # protects. A PR into any other branch may have no required checks or
    # review, and turning auto-merge on there would merge it at once.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    # Light lane, run-bound so a light runner only ever takes a job of this
    # run: see "Light lane" in the README.
    runs-on: >-
      ${{ inputs.runs-on
      || (inputs.light && vars.CI_LIGHT_RUNNER == 'tankster-light'
      && format('tankster-light-{0}-{1}', github.run_id, github.run_attempt))
      || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, inputs.label) }}
        run: |
          set -euo pipefail
          if [ "${HAS_LABEL}" = "true" ]; then
            # A failed opt-out must fail the job, or the label would look like
            # it worked while auto-merge stays on. Only call --disable-auto
            # when auto-merge is actually on, so "already off" is not an error.
            enabled=$(gh pr view "${PR}" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "${enabled}" = "true" ]; then
              echo "Opt-out label present; disabling auto-merge."
              gh pr merge "${PR}" --disable-auto
            else
              echo "Opt-out label present; auto-merge is already off."
            fi
          else
            echo "No opt-out label; enabling auto-merge (--${MERGE_METHOD})."
            gh pr merge "${PR}" --auto "--${MERGE_METHOD}"
          fi
