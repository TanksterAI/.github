# Reusable Claude line-level PR review.
#
# CodeRabbit is already installed org-wide, but its Free-tier cap (1 included
# review/hour, walkthrough-only -- confirmed live on tankster-ai-public#3)
# makes it unusable as the signal an auto-merge gate depends on. This runs
# Claude itself as the line-level reviewer instead: billed as ordinary Claude
# API usage against this org's own key, not a per-seat SaaS limit.
# CodeRabbit's summary still posts and still gets read by
# claude-address-feedback.yml -- this fills the gap it leaves, it does not
# replace it.
#
# Runs the same `code-review` skill Anthropic's own hosted Code Review
# product uses, through your own ANTHROPIC_API_KEY at ordinary API rates
# instead of that product's $15-25/review managed price and its
# Team/Enterprise-plan requirement. See https://code.claude.com/docs/en/code-review
# and https://code.claude.com/docs/en/github-actions#run-a-skill.
name: claude-review

on:
  workflow_call:
    inputs:
      timeout-minutes:
        type: number
        default: 20
    secrets:
      anthropic-api-key:
        required: true

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic-api-key }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
