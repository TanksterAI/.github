# Reusable security scan.
#
# Deliberately does NOT use CodeQL or upload SARIF: both require GitHub Code
# Security on private repositories, and most of this estate is private. Every
# tool below is free and works identically on public and private repos.
#
#   osv-scanner  vulnerable dependencies across npm / PyPI / crates / Go
#   gitleaks     secrets, CLI form (MIT). The gitleaks *Action* needs a licence
#                key for org-owned repos; the CLI does not.
#   native audit npm audit / pip-audit / cargo-audit for ecosystem-specific advisories
#
# ONE JOB, ON PURPOSE. These were three jobs until Oct 2026. GitHub bills
# every job rounded up to a whole minute and the fallback runner boots a VM
# per job, so three jobs doing ~45 s of work between them billed 3 minutes
# (8 on Rust, where `cargo install cargo-audit` compiled from source for ~6
# minutes). Now the blocking scanners run as steps that do not stop each
# other, and a final step fails the job if either found something.
#
# The native audit is advisory (audit-strict false) and its advisories are
# already in OSV (RustSec, PyPA/PYSEC and GHSA are all OSV sources), so it
# runs on the weekly schedule and on manual runs, not on every PR and push.
# A caller that sets audit-strict gets it on every run, as before.
#
# No step pushes, so the checkout keeps no token: the audit step installs and
# runs third-party code (pip install), which must not find it in
# .git/config. Actions are pinned to commit SHAs.
#
# DOCKER-FREE, so it can run on the light lane (Cloud Run, no Docker).
# osv-scanner is the release binary rather than google's
# osv-scanner-action, which is a Docker action whose image also carried Go;
# Go is installed here when the tree has a go.mod, for osv-scanner's call
# analysis. gitleaks and osv-scanner go into $RUNNER_TEMP/bin, checked
# against pinned SHA-256 sums, and need no root.
name: security

on:
  workflow_call:
    inputs:
      ecosystem:
        description: node, python, rust, or none. Drives the native audit step.
        type: string
        default: none
      runs-on:
        description: >-
          Runner label. Empty (the default) follows the organisation's
          CI_RUNNER variable, which moves CI onto the Cloud Build fallback
          runner when the included Actions minutes run out, and means
          ubuntu-latest when that variable is unset. A value here also
          overrides light.
        type: string
        default: ""
      light:
        description: >-
          Run on the Cloud Run light runner, which has no Docker, once the
          organisation opens the light lane (CI_LIGHT_RUNNER is
          tankster-light). Until then, or when runs-on is set, it changes
          nothing. Nothing in this workflow needs Docker, and it uploads
          nothing, so it stays far below the 64 MiB a light job may send.
          The light image has no C/C++ toolchain, so the python audit's
          `pip install -e .` fails there for a package that builds native
          code from source. The audit is advisory, so that is only a
          warning; with audit-strict, pass false for such a package.
        type: boolean
        default: true
      osv:
        type: boolean
        default: true
      osv-version:
        description: >-
          osv-scanner release. Change osv-sha256 with it: the checksum of
          osv-scanner_linux_amd64 in that release's osv-scanner_SHA256SUMS.
        type: string
        default: 2.7.1
      osv-sha256:
        description: >-
          SHA-256 of osv-scanner_linux_amd64 for osv-version. The install
          fails closed when it does not match.
        type: string
        default: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
      osv-scan-args:
        description: osv-scanner arguments, split on whitespace (one per line by convention).
        type: string
        default: |
          --recursive
          ./
      gitleaks:
        type: boolean
        default: true
      gitleaks-version:
        description: >-
          gitleaks release. Change gitleaks-sha256 with it: the checksum of
          gitleaks_<version>_linux_x64.tar.gz in that release's checksums.
        type: string
        default: 8.30.1
      gitleaks-sha256:
        description: >-
          SHA-256 of the gitleaks tarball for gitleaks-version. The install
          fails closed when it does not match.
        type: string
        default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      gitleaks-history:
        description: >-
          Scan full git history rather than just the working tree. Slower, but a
          secret that was committed and later removed is still a leaked secret.
        type: boolean
        default: true
      audit-strict:
        description: >-
          Fail the build on native-audit findings. Advisory by default because a
          transitive advisory with no fix available should not block an
          unrelated PR; osv-scanner and gitleaks are blocking regardless.
        type: boolean
        default: false
      audit-level:
        description: npm audit severity threshold.
        type: string
        default: high
      node-version-file:
        type: string
        default: .nvmrc
      python-version:
        type: string
        default: "3.12"
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  scan:
    name: Security scan
    # No runner at all when there is nothing to run: every scanner switched
    # off, or only the advisory audit enabled on a pull request.
    if: >-
      inputs.osv || inputs.gitleaks ||
      (inputs.ecosystem != 'none' && (inputs.audit-strict || github.event_name != 'pull_request'))
    # Light lane, run-bound so a light runner only ever takes a job of this
    # run: see "Light lane" in the README.
    runs-on: >-
      ${{ inputs.runs-on
      || (inputs.light && vars.CI_LIGHT_RUNNER == 'tankster-light'
      && format('tankster-light-{0}-{1}', github.run_id, github.run_attempt))
      || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `gitleaks git` can see secrets that were committed
          # and later deleted. fetch-depth: 0 is required for that to mean anything.
          # Quoted deliberately: in GitHub expressions 0 is falsy, so an unquoted
          # `x && 0 || 1` always yields 1. The strings are both truthy.
          fetch-depth: ${{ inputs.gitleaks && inputs.gitleaks-history && '0' || '1' }}

      # The release binary, not google/osv-scanner-action (a Docker action,
      # so never on the light lane) nor its reusable workflow (that uploads
      # SARIF to code scanning, which needs GitHub Code Security on private
      # repos). The same osv-scanner build: it scans and exits non-zero on
      # findings. continue-on-error so gitleaks still runs; the
      # verdict step below fails the job on its outcome, and an install
      # that failed counts as a failure there too.
      - name: Install osv-scanner
        id: osv-install
        if: inputs.osv
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64" \
            -o "${RUNNER_TEMP}/bin/osv-scanner"
          if ! echo "${SHA256}  ${RUNNER_TEMP}/bin/osv-scanner" | sha256sum -c -; then
            echo "::error title=osv-scanner checksum::osv-scanner_linux_amd64 v${VERSION} does not match osv-sha256; set osv-sha256 to its line in that release's osv-scanner_SHA256SUMS"
            exit 1
          fi
          chmod 0755 "${RUNNER_TEMP}/bin/osv-scanner"
          "${RUNNER_TEMP}/bin/osv-scanner" --version
        env:
          VERSION: ${{ inputs.osv-version }}
          SHA256: ${{ inputs.osv-sha256 }}

      # osv-scanner analyses which Go vulnerabilities the code calls, and
      # without `go` it counts every one as called, so uncalled ones would
      # fail the scan. The action's image was golang:alpine; the light and
      # Cloud Build images have no Go. Nothing is cached, so nothing is
      # uploaded.
      - name: Go, for osv-scanner's call analysis
        if: inputs.osv && steps.osv-install.outcome == 'success' && hashFiles('**/go.mod') != ''
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Vulnerable dependencies (osv-scanner)
        id: osv
        if: inputs.osv && steps.osv-install.outcome == 'success'
        continue-on-error: true
        # As upstream's entrypoint for the action (exit_code_redirect.sh in
        # osv-scanner v2.5.0) intends: the arguments split on any whitespace
        # (without its glob expansion), and exit 128 (no lockfiles found) is
        # a pass with a warning unless the arguments say
        # --allow-no-lockfiles=false.
        run: |
          set -euo pipefail
          mapfile -t args < <(printf '%s' "${SCAN_ARGS}" | tr -s '[:space:]' '\n' | sed '/^$/d')
          status=0
          "${RUNNER_TEMP}/bin/osv-scanner" "${args[@]}" || status=$?
          if [ "${status}" -eq 128 ]; then
            case " ${args[*]} " in
              *" --allow-no-lockfiles=false "* | *" -allow-no-lockfiles=false "*) ;;
              *)
                echo "::warning title=osv-scanner found no lockfiles::nothing was scanned; pass --allow-no-lockfiles to silence this"
                status=0
                ;;
            esac
          fi
          exit "${status}"
        env:
          SCAN_ARGS: ${{ inputs.osv-scan-args }}
          # As the action set it: a go.mod asking for a newer Go fetches it.
          GOTOOLCHAIN: auto

      - name: Install gitleaks
        id: gitleaks-install
        if: inputs.gitleaks
        continue-on-error: true
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "$url" -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          if ! echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -; then
            echo "::error title=gitleaks checksum::gitleaks v${VERSION} does not match gitleaks-sha256; set gitleaks-sha256 to its line in that release's checksums"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/bin" gitleaks
          "${RUNNER_TEMP}/bin/gitleaks" version
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}

      - name: Secrets (gitleaks)
        id: gitleaks
        if: inputs.gitleaks && steps.gitleaks-install.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${HISTORY}" = "true" ]; then
            "${RUNNER_TEMP}/bin/gitleaks" git . --redact --verbose --exit-code 1
          else
            "${RUNNER_TEMP}/bin/gitleaks" dir . --redact --verbose --exit-code 1
          fi
        env:
          HISTORY: ${{ inputs.gitleaks-history }}

      # Advisory audit: weekly and on demand, or every run when strict.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        # Advisory unless strict: a failed install must not turn the run red.
        continue-on-error: ${{ !inputs.audit-strict }}
        if: >-
          inputs.ecosystem == 'node' &&
          (inputs.audit-strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          node-version-file: ${{ inputs.node-version-file }}
          # Nothing is saved on the light runner (runner name crj-): a
          # package store can be more than the 64 MiB a light job may send.
          package-manager-cache: ${{ !startsWith(runner.name, 'crj-') }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # Advisory unless strict: a failed install must not turn the run red.
        continue-on-error: ${{ !inputs.audit-strict }}
        if: >-
          inputs.ecosystem == 'python' &&
          (inputs.audit-strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          python-version: ${{ inputs.python-version }}

      # A prebuilt binary in seconds, instead of `cargo install` compiling it
      # for ~6 minutes. Run as `cargo-audit audit` so no Rust toolchain is
      # needed: the fallback runner has rustup with no default toolchain, so
      # `cargo audit` failed there in under a second, hidden by
      # continue-on-error.
      - name: Install cargo-audit
        # Advisory unless strict: a failed install must not turn the run red.
        continue-on-error: ${{ !inputs.audit-strict }}
        if: >-
          inputs.ecosystem == 'rust' &&
          (inputs.audit-strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Ecosystem audit
        id: audit
        if: >-
          inputs.ecosystem != 'none' &&
          (inputs.audit-strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        run: |
          set -euo pipefail
          case "${ECOSYSTEM}" in
            node)
              npm audit --audit-level="${AUDIT_LEVEL}"
              ;;
            python)
              python -m pip install pip-audit
              if [ -f requirements.txt ]; then
                pip-audit -r requirements.txt
              else
                python -m pip install -e .
                pip-audit
              fi
              ;;
            rust)
              if [ ! -f Cargo.lock ]; then
                if [ "${STRICT}" = "true" ]; then
                  echo "::error title=No Cargo.lock::cargo-audit needs a lockfile, and audit-strict is true."
                  exit 1
                fi
                echo "::notice title=No Cargo.lock::cargo-audit needs a lockfile; skipped."
                exit 0
              fi
              cargo-audit audit
              ;;
            *)
              echo "::error title=Unknown ecosystem::'${ECOSYSTEM}' is not one of node, python, rust, none."
              exit 1
              ;;
          esac
        env:
          ECOSYSTEM: ${{ inputs.ecosystem }}
          AUDIT_LEVEL: ${{ inputs.audit-level }}
          STRICT: ${{ inputs.audit-strict }}

      - name: Verdict
        if: always()
        run: |
          {
            echo "### Security scan"
            echo
            echo "| Scanner | Outcome |"
            echo "|---|---|"
            echo "| osv-scanner (blocking) | ${OSV_INSTALL:+install ${OSV_INSTALL}, }scan ${OSV:-skipped} |"
            echo "| gitleaks (blocking) | ${GITLEAKS_INSTALL:+install ${GITLEAKS_INSTALL}, }scan ${GITLEAKS:-skipped} |"
            echo "| ${ECOSYSTEM} audit ($([ "${STRICT}" = "true" ] && echo blocking || echo "advisory, weekly")) | ${AUDIT:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for pair in "osv-scanner install:${OSV_INSTALL}" "osv-scanner:${OSV}" "gitleaks install:${GITLEAKS_INSTALL}" "gitleaks:${GITLEAKS}"; do
            if [ "${pair#*:}" = "failure" ]; then
              echo "::error title=${pair%%:*} failed::see its step above"
              failed=1
            fi
          done
          if [ "${AUDIT}" = "failure" ]; then
            if [ "${STRICT}" = "true" ]; then
              echo "::error title=Ecosystem audit failed::audit-strict is true"
              failed=1
            else
              echo "::warning title=Ecosystem audit findings (advisory)::see the Ecosystem audit step"
            fi
          fi
          exit "${failed}"
        env:
          OSV_INSTALL: ${{ steps.osv-install.outcome }}
          OSV: ${{ steps.osv.outcome }}
          GITLEAKS_INSTALL: ${{ steps.gitleaks-install.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
          STRICT: ${{ inputs.audit-strict }}
